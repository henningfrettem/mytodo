<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas prototype</title>
<!--
  A test bench for canvas.js, outside the app. Each drawing is kept in this
  browser's localStorage only; nothing here touches Supabase or your notes.
-->
<style>
  :root {
    --paper: #faf8f3;
    --paper-2: #ece7db;
    --ink: #141108;
    --ink-2: #2f2a22;
    --mute: #6a6252;
    --rule: #cdc3ae;
    --rule-soft: #ddd4be;
    --accent: #a0391c;
    --font-body: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 var(--font-body);
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--rule-soft);
    background: rgba(243, 237, 224, .75);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--paper-2); }
  .tabs button {
    height: 28px;
    padding: 0 14px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    font: inherit;
    font-size: 13px;
    color: var(--mute);
    cursor: pointer;
  }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(26, 22, 18, .1); }
  .hint { flex: 1; font-size: 12px; line-height: 1.45; color: var(--mute); }
  header > button {
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  header > button:hover { background: var(--paper-2); }
  #stage { flex: 1; min-height: 0; }
</style>
<script src="canvas.js"></script>
</head>
<body>
<header>
  <h1>Canvas prototype</h1>
  <div class="tabs" role="tablist">
    <button type="button" data-mode="diagram" role="tab">Diagram</button>
    <button type="button" data-mode="mindmap" role="tab">Mind map</button>
  </div>
  <span class="hint" id="hint"></span>
  <button id="reset" type="button">Reset example</button>
  <button id="clear" type="button">Start empty</button>
</header>
<div id="stage"></div>
<script>
(function () {
  const KEYS = { diagram: "todo.canvasPrototype", mindmap: "todo.canvasPrototype.mindmap" };
  const MODE_KEY = "todo.canvasPrototype.mode";
  const HINTS = {
    diagram: "Hover a shape for its four connection dots (drag one to another shape) and the + buttons. "
      + "Double-click to type. Right-drag to pan, scroll to zoom, drag empty space to select.",
    mindmap: "Hover a box for its + buttons, or drag a dot out into open space. Double-click to type; "
      + "while typing, Tab starts a branch, Enter the next box on the same level, Shift+Enter a new line. "
      + "Drag a box to move its branch, or drop it on another box to re-attach it. Right-drag to pan, scroll to zoom."
  };

  const examples = {
    diagram: {
      v: 1, type: "diagram",
      nodes: [
        { id: "idea", shape: "oval", x: 0, y: 100, w: 140, h: 80, color: 1, text: "New idea" },
        { id: "draft", shape: "rect", x: 220, y: 100, w: 160, h: 80, color: 0, text: "Draft a short plan" },
        { id: "review", shape: "rect", x: 460, y: 100, w: 160, h: 80, color: 3, text: "Review with the team" },
        { id: "ship", shape: "oval", x: 700, y: 100, w: 140, h: 80, color: 2, text: "Ship it" },
        { id: "rework", shape: "rect", x: 460, y: 280, w: 160, h: 80, color: 4, text: "Rework the plan" },
        { id: "input1", shape: "rect", x: 220, y: -80, w: 140, h: 60, color: 0, text: "Customer feedback" },
        { id: "input2", shape: "rect", x: 400, y: -80, w: 140, h: 60, color: 0, text: "Usage numbers" }
      ],
      links: [
        { id: "l1", from: { node: "idea", side: "right" }, to: { node: "draft", side: "left" }, style: "elbow", arrow: "end", label: "" },
        { id: "l2", from: { node: "draft", side: "right" }, to: { node: "review", side: "left" }, style: "elbow", arrow: "end", label: "" },
        { id: "l3", from: { node: "review", side: "right" }, to: { node: "ship", side: "left" }, style: "elbow", arrow: "end", label: "approved" },
        { id: "l4", from: { node: "review", side: "bottom" }, to: { node: "rework", side: "top" }, style: "elbow", arrow: "end", label: "changes" },
        { id: "l5", from: { node: "rework", side: "left" }, to: { node: "draft", side: "bottom" }, style: "elbow", arrow: "end", label: "" },
        { id: "l6", from: { node: "input1", side: "bottom" }, to: { node: "draft", side: "top" }, style: "curved", arrow: "none", label: "" },
        { id: "l7", from: { node: "input2", side: "bottom" }, to: { node: "draft", side: "top" }, style: "curved", arrow: "none", label: "" }
      ]
    },
    // Positions are left at zero: the example is tidied when it's loaded.
    mindmap: {
      v: 1, type: "mindmap",
      nodes: [
        { id: "c", parent: null, text: "Q4 planning", color: 1 },
        { id: "h", parent: "c", side: "right", text: "Hiring", color: 3 },
        { id: "h1", parent: "h", side: "right", text: "Two backend developers", color: 3 },
        { id: "h2", parent: "h", side: "right", text: "One designer", color: 3 },
        { id: "i", parent: "c", side: "right", text: "Ingestion rework", color: 3 },
        { id: "i1", parent: "i", side: "right", text: "Queue for image processing", color: 3 },
        { id: "i2", parent: "i", side: "right", text: "Retry policy\nand alerting", color: 3 },
        { id: "b", parent: "c", side: "left", text: "Budget", color: 2 },
        { id: "b1", parent: "b", side: "left", text: "Tools", color: 2 },
        { id: "b2", parent: "b", side: "left", text: "Team offsite", color: 2 },
        { id: "r", parent: "c", side: "bottom", text: "Risks", color: 4 },
        { id: "r1", parent: "r", side: "bottom", text: "On-call load", color: 4 },
        { id: "r2", parent: "r", side: "bottom", text: "Vendor delays", color: 4 }
      ]
    }
  };

  const read = key => { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } };
  const write = (key, v) => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} };

  let mode = localStorage.getItem(MODE_KEY) === "mindmap" ? "mindmap" : "diagram";
  const canvas = TodoCanvas.create(document.getElementById("stage"), {
    data: { type: mode },
    onChange(data) { write(KEYS[mode], data); }
  });
  window.canvas = canvas;

  function show(m, { fresh = false, empty = false } = {}) {
    mode = m;
    try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    document.getElementById("hint").textContent = HINTS[m];
    const saved = fresh || empty ? null : read(KEYS[m]);
    canvas.setData(empty ? { type: m } : saved || examples[m]);
    if (!saved && !empty && m === "mindmap") canvas.tidyAll();
    write(KEYS[m], canvas.getData());
    requestAnimationFrame(() => canvas.fit());
  }

  document.querySelectorAll(".tabs button").forEach(b =>
    b.addEventListener("click", () => show(b.dataset.mode)));
  document.getElementById("reset").addEventListener("click", () => show(mode, { fresh: true }));
  document.getElementById("clear").addEventListener("click", () => show(mode, { empty: true }));
  show(mode);
})();
</script>
</body>
</html>
